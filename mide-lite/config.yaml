# MIDE-Lite Configuration
# See config-reference.md for detailed documentation

efficiency_profile: "standard"  # economy | standard | comprehensive

execution:
  max_agents_per_workflow: 4    # economy: 2, comprehensive: null
  max_parallel_agents: 2        # economy: 1, comprehensive: 4
  max_iterations: 2             # economy: 1, comprehensive: 3
  timeout_minutes: 15           # economy: 10, comprehensive: 30
  enabled_agents: null          # null = all, or list to restrict
  complexity_enforcement:
    enable: true
    simple: ["economy", "standard", "comprehensive"]
    moderate: ["standard", "comprehensive"]
    high: ["comprehensive"]
    on_exceed: "warn"           # warn | downgrade | block

supervisor:
  output_mode: "balanced"       # minimal | balanced | full
  storage_mode: "ephemeral"     # ephemeral | session | persistent
  storage:
    ephemeral:
      enable_file_storage: false
    session:
      location: "/tmp/mide-session-{session_id}/"
      auto_cleanup: true
      ttl_minutes: 60
    persistent:
      location: "traces/"
      require_user_confirmation: true
      gitignore: true

  synthesis:
    max_promoted_artifacts: 3   # economy: 2, comprehensive: 5
    always_promote_severity: ["critical", "high"]
    collapse_minor_findings: true
    preserve_technical_details: true
    artifact_budget:
      max_per_agent: 5          # economy: 2, comprehensive: null
      max_per_workflow: 15      # economy: 6, comprehensive: null
      max_artifact_size_kb: 50  # economy: 20, comprehensive: 200
      enforcement: "strict"     # strict | warn | log
      on_exceed:
        action: "truncate"      # truncate | skip | error
        message: "Artifact budget exceeded."
      auto_filter_on_over_promotion: true
      over_promotion_threshold: 0.5
    quality_gates:
      large_artifact_threshold_kb: 10
      low_confidence_threshold: 0.6
      early_termination:
        enable: false           # economy: true
        confidence_threshold: 0.85
        skip_optional_phases:
          enable: false
          phases: ["additional-review", "extended-testing", "performance-analysis"]
      skip_review_on_high_confidence:
        enable: false
        confidence_threshold: 0.95
        only_for_simple_workflows: true

  interactive:
    confirm_before_file_creation: true
    offer_save_option: true
    auto_save_criteria:
      confidence_below: 0.5
      critical_findings_count: 3
      blockers_present: true

  validation:
    enable_validation: true
    log_tagging_stats: true
    apply_type_overrides: true

  context_optimization:
    enable_compression: false   # economy: true
    lazy_load_contracts: false  # economy: true
    truncate_long_files:
      enable: false
      max_lines: 500            # economy: 200, comprehensive: 1000
    summarize_handoffs:
      enable: false
      max_summary_lines: 50     # economy: 20, comprehensive: 100
    skip_optional_rules: false  # economy: true

  cost_tracking:
    enable: true
    workflow_estimates:
      bug-fix: { min: 2000, typical: 4000, max: 8000 }
      feature-development: { min: 5000, typical: 10000, max: 20000 }
      parallel-code-review: { min: 8000, typical: 15000, max: 30000 }
    warnings:
      token_threshold: 10000
      require_confirmation_above: 15000
      show_estimate: false      # economy: true
    reporting:
      show_usage: false         # economy: true
      log_to_file: false
      log_location: "traces/token-usage.log"

artifact_type_rules:
  user_facing_types: [design_doc, api_contract, adr, deployment_guide, user_documentation]
  agent_internal_types: [analysis_report, diagnostic_trace, implementation_notes, research_notes]
  conditional_types: [review_report, test_plan, code]
